<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - FlyTripVisa</title>

    .box{background:#222;padding:30px;border-radius:8px;display:flex;flex-direction:column;gap:10px;width:300px}

  <div class="box">
    <h3>🆔 Login / Sign Up</h3>
    <input type="email" placeholder="Email">

    <button onclick="location.href='/dashboard.html'">Login</button>
  </div>
</body>
</html>
